server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true

spring.config.import=optional:file:hush.env[.properties]

vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example
ayos.dev.demo-login=true
ayos.dev.show-reset-codes=true
ayos.dev.demo-password=${AYOS_DEMO_PASSWORD:demo1234}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ayosbarangay?serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}

ayos.barangay.name=${BARANGAY_NAME:}
ayos.barangay.location=${BARANGAY_LOCATION:}
ayos.emergency.police=${EMERGENCY_POLICE:}
ayos.emergency.hotline=${EMERGENCY_HOTLINE:911}
ayos.emergency.red-cross=${EMERGENCY_RED_CROSS:}
ayos.emergency.barangay=${EMERGENCY_BARANGAY:}
ayos.emergency.ncmh=${EMERGENCY_NCMH:0917-899-8727}

ayos.upload-dir=${UPLOAD_DIR:./uploads}

ayos.groq.api-key=${GROQ_API_KEY:}
ayos.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
