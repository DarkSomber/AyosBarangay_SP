server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example
# TEMPORARY: shows the "Test as Resident / Test as Admin" buttons and seeds the demo accounts.
# Testing only. Forced off under the "prod" profile (see application-prod.properties).
ayos.dev.demo-login=true
# for the reset code something
ayos.dev.show-reset-codes=true
# Password given to the seeded demo accounts (dev only).
ayos.dev.demo-password=demo1234

# TEMP-DEV: database off. Uses the in-memory repositories so the app runs without MySQL.
# To turn MySQL back on: delete the exclude line below and uncomment the three datasource lines.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ayosbarangay?serverTimezone=Asia/Manila}
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:12345}

ayos.upload-dir=${UPLOAD_DIR:./uploads}

# Groq report analysis. The API key is optional until an admin requests analysis.
ayos.groq.api-key=${GROQ_API_KEY:}
ayos.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}